name: Bug report
description: Something in Vaulty does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **This repository is public.** Do not include customer or tenant names, tenant IDs, user names, e-mail
        addresses, file names, logs with real data or screenshots. Report security problems privately through the
        Security tab, never as an issue.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `vaulty status` or the version shown in the web interface.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce, with synthetic data only
