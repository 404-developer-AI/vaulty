# Drop-in for postgresql@17-main.service, installed as
#   /etc/systemd/system/postgresql@17-main.service.d/vaulty-credentials.conf
#
# Gives the PostgreSQL server process (and therefore archive_command, which runs as its child)
# access to the pgBackRest repository credentials without writing them to pgbackrest.conf.
# The wrapper /opt/vaulty/current/bin/vaulty-pgbackrest exports them as PGBACKREST_* variables
# for the duration of a single pgbackrest invocation.
[Service]
LoadCredentialEncrypted=pgbackrest-s3-key:/etc/vaulty/credentials/pgbackrest-s3-key.cred
LoadCredentialEncrypted=pgbackrest-s3-key-secret:/etc/vaulty/credentials/pgbackrest-s3-key-secret.cred
LoadCredentialEncrypted=pgbackrest-cipher-pass:/etc/vaulty/credentials/pgbackrest-cipher-pass.cred
